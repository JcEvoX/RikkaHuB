# 优先走国内镜像；官方 services.gradle.org 作为网络更好环境下的回退，可在 CI 中覆写 distributionUrl。
# AGP 9.3+ 最低要求 Gradle 9.5.0，不要回落到 9.4.x。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.5.0-bin.zip
networkTimeout=100000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
